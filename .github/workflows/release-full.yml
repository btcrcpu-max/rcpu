name: Release Full (Linux + Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed node release tag to rebuild and (re)publish, e.g. v1.4.18. Run with --ref <tag>.'
        required: true
        type: string

# Least privilege: the build jobs only read the repository. The `release` job
# below re-grants contents:write, because publishing the release is the only
# step that needs it.
permissions:
  contents: read

jobs:
  # A bare `v*` tag is not enough to identify a node release: the miner line
  # also uses v tags (v1.0.x). Building installers and a 700 MB AppImage for a
  # miner tag wastes CI time and publishes the wrong artifacts. Gate every
  # build on a real node release tag.
  tag-guard:
    name: Verify node release tag
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          event="${GITHUB_EVENT_NAME}"
          # A manual retry exists so a failed publish can be repeated without
          # re-signing the tag. Run it with --ref <tag>; if it lands on a branch
          # the input cannot match and the run is almost certainly a mistake.
          if [ "$event" = "workflow_dispatch" ] && [ -n "${INPUT_TAG:-}" ] \
              && [ "${INPUT_TAG}" != "${tag}" ]; then
            echo "::error::input tag '${INPUT_TAG}' does not match the checked-out ref '${tag}'. Pass --ref ${INPUT_TAG}."
            exit 1
          fi
          # Node releases: v<major>.<minor>.<build> with minor >= 1 (1.1.x, 1.2.x, 1.3.x, 1.4.x).
          # Miner releases: 1.0.x, tagged `miner-v<version>`.
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ ! "$tag" =~ ^v1\.0\. ]]; then
            node_tag=true
          else
            node_tag=false
          fi
          if [ "$event" = "workflow_dispatch" ]; then
            # Keep manual runs useful for inspecting artifacts: build anything,
            # but only a node tag ref may publish (see `publish` below).
            ok=true
          else
            ok=$node_tag
          fi
          if [ "$ok" != true ]; then
            echo "::notice::'$tag' is not a node release tag (expected vX.Y.Z with minor >= 1); skipping node builds. Miner releases use miner-v*."
          fi
          publish=false
          if [ "$node_tag" = true ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            publish=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Verify signed release tag
        if: steps.check.outputs.publish == 'true'
        shell: bash
        run: |
          # M-9: a tag push alone is not authorization. Require an annotated,
          # valid signature from the RCPU release key before any build starts.
          # Do not soften this back to a warning: the release job signs the
          # artifacts with the project key, so an unsigned tag would let anyone
          # with tag-push rights obtain a fully "signed" release.
          gpg --batch --import "${GITHUB_WORKSPACE}/RCPU-DEV-GPG-KEY.asc"
          git fetch --tags --force origin
          if ! git verify-tag --raw "${GITHUB_REF_NAME}" > /tmp/tagverify.txt 2>&1; then
            cat /tmp/tagverify.txt
            echo "::error::Tag '${GITHUB_REF_NAME}' is unsigned or has an invalid signature; refusing to release."
            exit 1
          fi
          cat /tmp/tagverify.txt
          # The signing subkey appears immediately after VALIDSIG; the primary
          # key fingerprint is the last field on that line. Accept subkey
          # signatures from the release key and reject every other signer.
          if ! grep -qE "^\[GNUPG:\] VALIDSIG [0-9A-F]+ .*934D5BC95DD4B3ACFEF521B9547633501FE4B8EE" /tmp/tagverify.txt; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is signed by an unexpected key; refusing to release."
            exit 1
          fi
  build-randomx-linux:
    needs: tag-guard
    if: needs.tag-guard.outputs.ok == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download, patch, and build RandomX (Linux)
        run: |
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors -L -o /tmp/randomx-src.tar.gz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          patch -p1 < "${GITHUB_WORKSPACE}/depends/patches/randomx/custom_configuration.patch"
          grep 'RANDOMX_ARGON_SALT' src/configuration.h
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
      - name: Parity gate - native RandomX must reproduce chain hash (A2000 + A4000)
        # M-2: the Linux release binary is what most nodes run; gate the exact
        # librandomx.a that will be linked, exactly like the Windows job.
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -pthread -I/tmp/RandomX-1.2.1/src -o /tmp/parity \
            "$GITHUB_WORKSPACE/contrib/devtools/rx_parity_gate.cpp" \
            /tmp/RandomX-1.2.1/build/librandomx.a
          /tmp/parity || { echo "PARITY GATE FAILED"; exit 1; }
      - name: Upload RandomX Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: randomx-linux
          path: /tmp/RandomX-1.2.1/build/librandomx.a
          retention-days: 1

  build-randomx-windows:
    needs: tag-guard
    if: needs.tag-guard.outputs.ok == 'true'
    # Native Windows build via MSYS2/MinGW-w64.
    # Rationale: cross-compiling RandomX on ubuntu-22.04 with
    # g++-mingw-w64 (gcc 12) produced a library whose PoW hash differs from
    # chain consensus (wallets stuck at heights 2000/4000, "high-hash, proof
    # of work failed"). A MinGW-w64 -native- build (gcc 16, MSYS2) was proven
    # to reproduce the chain hash byte-for-byte (see parity gate below).
    #
    # DO NOT replace this job with a cross-compiled RandomX for Windows: the
    # parity gate and the installer must consume the SAME native .a built here.
    # The Windows GUI/daemon are cross-compiled from Ubuntu (build-windows),
    # but the RandomX library they link MUST come from this job's artifact.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup MSYS2 / MinGW-w64 native toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            curl
            patch
      - name: Download, patch, and build RandomX (Windows native MinGW-w64)
        shell: msys2 {0}
        run: |
          WS="${GITHUB_WORKSPACE//\\//}"
          set -euo pipefail
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors -L -o /tmp/randomx-src.tar.gz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          patch -p1 < "$WS/depends/patches/randomx/custom_configuration.patch"
          grep 'RANDOMX_ARGON_SALT' src/configuration.h
          mkdir build-win && cd build-win
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -G "MinGW Makefiles"
          mingw32-make -j$(nproc)
          test -f librandomx.a
      - name: Parity gate - native RandomX must reproduce chain hash (A2000 + A4000)
        # Regression gate: the library just built must compute the exact
        # RandomX hash of blocks A2000 and A4000 that chain nodes accept.
        # If this fails, the Windows PoW behaviour has drifted and the
        # release must be blocked.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE//\\//}"
          g++ -std=c++17 -O2 -I/tmp/RandomX-1.2.1/src -o /tmp/parity.exe \
            "$WS/contrib/devtools/rx_parity_gate.cpp" \
            /tmp/RandomX-1.2.1/build-win/librandomx.a
          /tmp/parity.exe || { echo "PARITY GATE FAILED"; exit 1; }
          mkdir -p ws && cp /tmp/RandomX-1.2.1/build-win/librandomx.a ws/
      - name: Upload RandomX Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: randomx-windows
          path: ws/librandomx.a
          retention-days: 1

  build-linux:
    needs: [tag-guard, build-randomx-linux]
    if: needs.tag-guard.outputs.ok == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev \
            automake pkg-config bsdmainutils python3 cmake curl
      - name: Verify depends tree
        run: |
          sed -i 's/\r$//' depends/gen_id 2>/dev/null || true
          chmod +x depends/gen_id depends/config.guess depends/config.sub 2>/dev/null || true
          if [ ! -x depends/gen_id ]; then
            echo "ERROR: depends/gen_id is not executable"
            ls -la depends/gen_id || true
            exit 1
          fi
          # These files are vendored in depends/. Fetching them at build time
          # from raw.githubusercontent.com would be an unverified download in
          # the release pipeline, so fail closed if one is missing instead.
          for f in depends/config.guess depends/config.sub \
                   depends/patches/qt/mac-qmake.conf; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing; depends/ is vendored, do not fetch it at build time"
              exit 1
            fi
          done
          chmod +x depends/gen_id depends/config.guess depends/config.sub
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: randomx-linux
          path: /tmp/randomx-linux/
      - name: Build depends
        run: make -C depends HOST=x86_64-pc-linux-gnu -j$(nproc)
      - name: Install RandomX into depends prefix
        run: |
          PREFIX="$PWD/depends/x86_64-pc-linux-gnu"
          mkdir -p "$PREFIX/lib" "$PREFIX/include"
          cp /tmp/randomx-linux/librandomx.a "$PREFIX/lib/"
          curl --fail -L -o /tmp/rx-src.tgz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/rx-src.tgz" | sha256sum -c -
          tar -xf /tmp/rx-src.tgz -C /tmp
          cp /tmp/RandomX-1.2.1/src/randomx.h "$PREFIX/include/"
          test -f "$PREFIX/include/randomx.h"
          test -f "$PREFIX/lib/librandomx.a"
      - name: Configure and build
        run: |
          PREFIX="$PWD/depends/x86_64-pc-linux-gnu"
          ./autogen.sh
          CONFIG_SITE="$PREFIX/share/config.site" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-L$PREFIX/lib" \
          ./configure --prefix="$PREFIX" \
            --disable-bench \
            --with-gui=qt5
          make -j$(nproc)
          make install
      - name: Consensus gate - unit suites (Linux)
        run: |
          # Replaces a `strings | grep` check: a symbol being present in the
          # binary does not prove the rule runs on every code path. Build with
          # tests enabled and execute the CT consensus suites for real.
          test -x src/test/test_bitcoin || {
            echo "ERROR: src/test/test_bitcoin missing (was the build configured with --disable-tests?)"
            exit 1
          }
          set -o pipefail
          ./src/test/test_bitcoin --log_level=test_suite \
            --run_test=coinbase_confidential_tests,confidential_validation_tests,tx_verify_tests,randomx_tests,pow_tests,dualalgo_tests \
            2>&1 | tee /tmp/rcpu-consensus.log
          # Fail closed if a suite name is typo'd or silently skipped.
          for suite in coinbase_confidential_tests confidential_validation_tests tx_verify_tests randomx_tests pow_tests dualalgo_tests; do
            grep -q "$suite" /tmp/rcpu-consensus.log || {
              echo "suite not executed: $suite"
              exit 1
            }
          done
          echo "OK: CT consensus suites passed on the release build"
      - name: Package Linux
        run: |
          PREFIX=$PWD/depends/x86_64-pc-linux-gnu
          PKGVER=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile | head -1)
          echo "PACKAGE_VERSION=$PKGVER"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGVER="${GITHUB_REF_NAME#v}"
            if [ "$PKGVER" != "$TAGVER" ]; then
              echo "ERROR: PACKAGE_VERSION=$PKGVER does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          STAGE=$PWD/rcpu-${PKGVER}
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$PREFIX/bin/rcpud" "$PREFIX/bin/rcpu-qt" \
                "$PREFIX/bin/rcpu-cli" "$PREFIX/bin/rcpu-tx" \
                "$PREFIX/bin/rcpu-wallet" "$STAGE/"
          # Never sign/package a partial or empty tarball: fail if any required
          # binary is missing or zero-length.
          for f in rcpud rcpu-qt rcpu-cli rcpu-tx rcpu-wallet; do
            test -s "$STAGE/$f" || { echo "ERROR: missing or empty $STAGE/$f"; exit 1; }
          done
          tar -C "$(dirname "$STAGE")" -czf \
            "rcpu-${PKGVER}-x86_64-linux-gnu.tgz" \
            "$(basename "$STAGE")"
          # Explicit filename: a bare *.tgz glob would also pick up any stray
          # archive left in the workspace and sign it into the checksum file.
          sha256sum "rcpu-${PKGVER}-x86_64-linux-gnu.tgz" > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-package
          path: |
            *.tgz
            SHA256SUMS-linux.txt

  build-windows:
    needs: [tag-guard, build-randomx-windows]
    if: needs.tag-guard.outputs.ok == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev \
            automake pkg-config bsdmainutils python3 cmake curl \
            g++-mingw-w64-x86-64-posix nsis zip osslsigncode
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Verify depends tree
        run: |
          sed -i 's/\r$//' depends/gen_id 2>/dev/null || true
          chmod +x depends/gen_id depends/config.guess depends/config.sub 2>/dev/null || true
          if [ ! -x depends/gen_id ]; then
            echo "ERROR: depends/gen_id is not executable"
            ls -la depends/gen_id || true
            exit 1
          fi
          # These files are vendored in depends/. Fetching them at build time
          # from raw.githubusercontent.com would be an unverified download in
          # the release pipeline, so fail closed if one is missing instead.
          for f in depends/config.guess depends/config.sub \
                   depends/patches/qt/mac-qmake.conf; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing; depends/ is vendored, do not fetch it at build time"
              exit 1
            fi
          done
          chmod +x depends/gen_id depends/config.guess depends/config.sub
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: randomx-windows
          path: /tmp/randomx-windows/
      - name: Build depends
        run: make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)
      - name: Install RandomX into depends prefix
        # The .a below is the MSYS2/MINGW64 -native- build produced by
        # build-randomx-windows (the same artifact that passed the parity
        # gate). It is the ONLY RandomX library allowed to be linked into the
        # Windows installer; never rebuild RandomX in this Ubuntu cross
        # environment, or the 2000/4000-height high-hash bug returns.
        run: |
          PREFIX="$PWD/depends/x86_64-w64-mingw32"
          mkdir -p "$PREFIX/lib" "$PREFIX/include"
          cp /tmp/randomx-windows/librandomx.a "$PREFIX/lib/"
          curl --fail -L -o /tmp/rx-src.tgz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/rx-src.tgz" | sha256sum -c -
          tar -xf /tmp/rx-src.tgz -C /tmp
          cp /tmp/RandomX-1.2.1/src/randomx.h "$PREFIX/include/"
          test -f "$PREFIX/include/randomx.h"
          test -f "$PREFIX/lib/librandomx.a"
      - name: Configure and build
        run: |
          PREFIX="$PWD/depends/x86_64-w64-mingw32"
          ./autogen.sh
          CONFIG_SITE="$PREFIX/share/config.site" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-L$PREFIX/lib" \
          ./configure --prefix="$PREFIX" \
            --disable-bench --disable-tests \
            --with-gui=qt5
          make -j$(nproc)
          make deploy
      - name: Verify Windows binary was produced
        run: |
          # The consensus behaviour of this build is gated by the Linux job's
          # unit suites for the same commit above, and by ci.yml on the same
          # commit. `strings | grep` only proved a symbol was linked in, not
          # that the rule executed, so it is not repeated here.
          BIN=$(ls -1t src/rcpud.exe 2>/dev/null | head -1)
          test -n "$BIN" && test -x "$BIN" || { echo "ERROR: src/rcpud.exe missing"; exit 1; }
          ls -l "$BIN"
          echo "OK: Windows rcpud.exe produced"
      - name: Package Windows
        run: |
          PKGVER=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile | head -1)
          echo "PACKAGE_VERSION=$PKGVER"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGVER="${GITHUB_REF_NAME#v}"
            if [ "$PKGVER" != "$TAGVER" ]; then
              echo "ERROR: PACKAGE_VERSION=$PKGVER does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          test -n "$PKGVER" || { echo "ERROR: PKGVER empty"; exit 1; }
          echo "=== looking for installer / exe ==="
          find . -maxdepth 3 \( -iname '*win64-setup.exe' -o -iname 'rcpu-qt.exe' -o -iname 'rcpud.exe' \) | head -50
          ls -la . src src/qt 2>/dev/null | head -80

          EXPECTED="rcpu-${PKGVER}-win64-setup.exe"
          EXE=""
          if [ -f "$EXPECTED" ]; then
            EXE="$EXPECTED"
          else
            # only the canonical rcpu-*-win64-setup.exe pattern; never bitcoin--*
            EXE=$(ls -1t rcpu-*-win64-setup.exe 2>/dev/null | head -1 || true)
          fi

          if [ -n "$EXE" ]; then
            test -s "$EXE" || { echo "ERROR: $EXE is empty"; exit 1; }
            # NSIS installer should be multiple MB, not a stub
            SIZE=$(stat -c%s "$EXE")
            test "$SIZE" -ge 1000000 || { echo "ERROR: $EXE too small ($SIZE bytes)"; exit 1; }
            file "$EXE" || true
            # Authenticode signing runs in the publish (`release`) job, not
            # here (R-4): this job executes the cross-compiler, NSIS and the
            # RandomX archive, so the signing certificate must not share its
            # environment. The publish job signs the artifact and regenerates
            # SHA256SUMS-windows.txt before it is gpg-signed.
            echo "Signing deferred to the release job"
            zip "rcpu-${PKGVER}-win64-setup.zip" "$EXE"
            sha256sum "$EXE" "rcpu-${PKGVER}-win64-setup.zip" > SHA256SUMS-windows.txt
            cat SHA256SUMS-windows.txt
            exit 0
          fi

          echo "No NSIS installer; packing portable zip"
          mkdir -p dist
          cp -v src/qt/rcpu-qt.exe dist/ 2>/dev/null || cp -v src/rcpu-qt.exe dist/
          cp -v src/rcpud.exe src/rcpu-cli.exe src/rcpu-tx.exe src/rcpu-wallet.exe dist/ 2>/dev/null || true
          test -f dist/rcpu-qt.exe
          test -s dist/rcpu-qt.exe
          zip -j "rcpu-${PKGVER}-win64-portable.zip" dist/*
          sha256sum "rcpu-${PKGVER}-win64-portable.zip" > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-package
          path: |
            *setup.exe
            *setup.zip
            *portable.zip
            SHA256SUMS-windows.txt

  release:
    needs: [tag-guard, build-linux, build-windows]
    # M-9: publishing requires a signed tag, never a bare branch. A manual retry
    # starts from the same tag ref and tag-guard re-verifies its signature, so
    # the retry path cannot bypass the guard.
    if: needs.tag-guard.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    # The only job that needs to publish; everything else stays read-only.
    permissions:
      contents: write
      # REL-02: build provenance attestations for the published assets.
      id-token: write
      attestations: write
    steps:
      # The read-back below runs contrib/verify-binaries/release_readback.py and
      # imports RCPU-DEV-GPG-KEY.asc, so the job needs the tree. It still pins
      # --repo on every GitHub call: gh infers the repository from a git remote,
      # and that inference is what broke the v1.4.18 publish.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-package
          path: linux/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-package
          path: windows/
      - name: Install osslsigncode (no signing secrets in this step)
        # M-5: install the tool before any signing secret is placed in the
        # environment, so a compromised apt mirror/PATH cannot read the PFX or
        # its passphrase.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode unzip
          osslsigncode --version
      - name: Sign Windows installer (Authenticode)
        # R-4/L-6: the certificate is used only in this publish job, which
        # downloads a finished artifact and runs no build toolchain. The
        # passphrase reaches osslsigncode through a 0600 file (-readpass),
        # never through argv, and every temporary secret is removed on exit.
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          # H-3 requires that a tag release never ships Windows binaries that
          # are silently unsigned. Signing stays the default and fail-closed
          # behaviour when a certificate is present. If the release manager
          # deliberately leaves WINDOWS_SIGNING_CERT unset, we degrade to an
          # explicitly labelled unsigned publish: binaries are renamed with an
          # "-unsigned" suffix so no download can be mistaken for an
          # Authenticode-signed build.
          UNSIGNED=0
          if [ -z "${WINDOWS_SIGNING_CERT:-}" ]; then
            echo "WARNING: WINDOWS_SIGNING_CERT is not configured."
            echo "WARNING: publishing Windows binaries with an explicit '-unsigned' suffix."
            UNSIGNED=1
          fi
          umask 077
          PFX="$RUNNER_TEMP/rcpu-sign.pfx"
          PASSFILE="$RUNNER_TEMP/rcpu-sign.pass"
          trap 'rm -f "$PFX" "$PASSFILE"' EXIT
          if [ "$UNSIGNED" -eq 0 ]; then
            printf '%s' "$WINDOWS_SIGNING_CERT" | base64 -d > "$PFX"
            printf '%s' "$WINDOWS_SIGNING_PASSWORD" > "$PASSFILE"
            signed=0
            for EXE in windows/*-win64-setup.exe; do
              [ -e "$EXE" ] || continue
              test -s "$EXE" || { echo "ERROR: $EXE is empty"; exit 1; }
              echo "Signing $EXE with Authenticode"
              osslsigncode sign -pkcs12 "$PFX" -readpass "$PASSFILE" \
                -n "RCPU Core" -i "https://rcpu.top" \
                -t "https://timestamp.digicert.com" \
                -in "$EXE" -out "${EXE}.signed"
              mv "${EXE}.signed" "$EXE"
              osslsigncode verify -in "$EXE"
              signed=$((signed + 1))
            done
            if [ "$signed" -eq 0 ]; then
              echo "ERROR: no Windows installer (*-win64-setup.exe) was found to sign; refusing to publish"
              exit 1
            fi
            # The setup ZIP was built before signing, so it still contains the
            # unsigned EXE. The ZIP is what users download, therefore it must be
            # rebuilt from the signed binary; otherwise the EXE inside is still
            # unsigned even though the standalone one is.
            for ZIP in windows/*-win64-setup.zip; do
              [ -e "$ZIP" ] || continue
              EXE="${ZIP%-setup.zip}-setup.exe"
              [ -f "$EXE" ] || { echo "ERROR: $EXE missing for $ZIP"; exit 1; }
              ( cd windows && rm -f "$(basename "$ZIP")" && zip -q "$(basename "$ZIP")" "$(basename "$EXE")" )
              echo "Rebuilt $ZIP from the signed installer"
            done
            # H-3 follow-up: the portable ZIP used to ship entirely unsigned
            # EXEs because the signing loop only matched *-setup.exe. Unpack it,
            # sign every PE binary, rebuild the ZIP, and verify each signature.
            for ZIP in windows/*-win64-portable.zip; do
              [ -e "$ZIP" ] || continue
              ZIP_ABS="$PWD/$ZIP"
              TMP="$RUNNER_TEMP/portable-$$"
              rm -rf "$TMP"; mkdir -p "$TMP"
              unzip -q "$ZIP" -d "$TMP"
              portable_signed=0
              while IFS= read -r -d '' EXE; do
                echo "Signing portable binary $EXE"
                osslsigncode sign -pkcs12 "$PFX" -readpass "$PASSFILE" \
                  -n "RCPU Core" -i "https://rcpu.top" \
                  -t "https://timestamp.digicert.com" \
                  -in "$EXE" -out "${EXE}.signed"
                mv "${EXE}.signed" "$EXE"
                osslsigncode verify -in "$EXE"
                portable_signed=$((portable_signed + 1))
              done < <(find "$TMP" -type f -iname '*.exe' -print0)
              if [ "$portable_signed" -eq 0 ]; then
                echo "ERROR: $ZIP contains no EXE to sign; refusing to publish an unsigned portable package"
                exit 1
              fi
              rm -f "$ZIP_ABS"
              ( cd "$TMP" && find . -type f -print | zip -q -j "$ZIP_ABS" -@ )
              rm -rf "$TMP"
              echo "Rebuilt $ZIP with $portable_signed signed EXE(s)"
            done
          else
            # Unsigned publish: keep the artifacts but make the missing
            # Authenticode signature impossible to overlook.
            for EXE in windows/*-win64-setup.exe; do
              [ -e "$EXE" ] || continue
              test -s "$EXE" || { echo "ERROR: $EXE is empty"; exit 1; }
              mv "$EXE" "${EXE%-setup.exe}-setup-unsigned.exe"
            done
            for ZIP in windows/*-win64-setup.zip; do
              [ -e "$ZIP" ] || continue
              mv "$ZIP" "${ZIP%-setup.zip}-setup-unsigned.zip"
            done
            for ZIP in windows/*-win64-portable.zip; do
              [ -e "$ZIP" ] || continue
              mv "$ZIP" "${ZIP%-portable.zip}-portable-unsigned.zip"
            done
            if ! ls windows/*-unsigned.* >/dev/null 2>&1; then
              echo "ERROR: no Windows artifact was found to publish; refusing"
              exit 1
            fi
            echo "Prepared unsigned Windows artifacts (no Authenticode signature)."
          fi
          # The signature changes the file, so the checksums must be rebuilt
          # here, before SHA256SUMS.txt is merged and gpg-signed below.
          (
            cd windows
            rm -f SHA256SUMS-windows.txt
            for f in *.exe *.zip; do
              [ -e "$f" ] || continue
              sha256sum "$f"
            done > SHA256SUMS-windows.txt
            cat SHA256SUMS-windows.txt
          )
      - name: Merge checksums
        run: |
          cat linux/SHA256SUMS-linux.txt windows/SHA256SUMS-windows.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign and verify with the RCPU release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # M-9: a release must be signed by the documented RCPU key. Do not
          # publish an unsigned or differently-keyed artifact on a tag build.
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "ERROR: GPG_PRIVATE_KEY is not configured; refusing to publish an unsigned release"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          FPR="934D5BC95DD4B3ACFEF521B9547633501FE4B8EE"
          gpg --batch --list-secret-keys "$FPR" >/dev/null
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --pinentry-mode loopback \
            --local-user "$FPR!" \
            --output SHA256SUMS.txt.asc \
            --detach-sig SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          {
            echo "RELEASE_FILES<<EOF"
            echo "linux/*"
            echo "windows/*"
            echo "SHA256SUMS.txt"
            echo "SHA256SUMS.txt.asc"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ env.RELEASE_FILES }}

      - name: Attest release assets
        # REL-02: sign a provenance attestation for every published asset so a
        # downloader can verify which workflow produced it.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            linux/*
            windows/*
            SHA256SUMS.txt
            SHA256SUMS.txt.asc

      - name: Read back the published release (fail closed)
        # REL-02: uploading is not proof that the release is complete. Compare
        # the asset list GitHub actually serves against the local files, then
        # re-download and verify the signed checksum file. Any mismatch fails
        # the job instead of leaving a silently incomplete release behind.
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never relied on a checkout when the read-back was first
          # written, so gh had no remote to infer the repository from and died
          # with "fatal: not a git repository" after every asset had been
          # published. The script pins --repo as well; both are deliberate.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 contrib/verify-binaries/release_readback.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --expected-dir linux \
            --expected-dir windows \
            --workdir readback \
            --allow-extra 'rcpu-qt-*' \
            --allow-extra 'SHA256SUMS-*.txt' \
            --signature-key RCPU-DEV-GPG-KEY.asc
