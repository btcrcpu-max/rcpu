name: Release Full (Linux + Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-randomx-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Download and build RandomX (Linux)
        run: |
          curl --fail -L -o /tmp/randomx-src.tar.gz \
            https://github.com/tevador/RandomX/archive/refs/tags/v1.2.1.tar.gz
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
      - name: Upload RandomX Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: randomx-linux
          path: /tmp/RandomX-1.2.1/build/librandomx.a
          retention-days: 1

  build-randomx-windows:
    runs-on: ubuntu-22.04
    steps:
      - name: Install mingw
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update -qq
          sudo apt-get install -y g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Create MinGW toolchain file
        run: |
          cat > /tmp/mingw-w64-x86_64.cmake << 'TOOLCHAIN'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR AMD64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          TOOLCHAIN
      - name: Download and build RandomX (Windows cross)
        run: |
          curl --fail -L -o /tmp/randomx-src.tar.gz \
            https://github.com/tevador/RandomX/archive/refs/tags/v1.2.1.tar.gz
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          mkdir build-win && cd build-win
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/mingw-w64-x86_64.cmake
          make -j$(nproc)
      - name: Upload RandomX Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: randomx-windows
          path: /tmp/RandomX-1.2.1/build-win/librandomx.a
          retention-days: 1

  build-linux:
    needs: build-randomx-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev \
            automake pkg-config bsdmainutils python3 cmake curl
      - name: Repair depends tree
        run: |
          chmod +x depends/gen_id depends/config.guess depends/config.sub 2>/dev/null || true
          if [ ! -x depends/gen_id ]; then
            echo "ERROR: depends/gen_id is not executable"
            ls -la depends/gen_id || true
            exit 1
          fi
          if [ ! -f depends/config.guess ]; then
            curl --fail -L -o depends/config.guess \
              https://raw.githubusercontent.com/bitcoin/bitcoin/v27.0/depends/config.guess
          fi
          if [ ! -f depends/config.sub ]; then
            curl --fail -L -o depends/config.sub \
              https://raw.githubusercontent.com/bitcoin/bitcoin/v27.0/depends/config.sub
          fi
          if [ ! -f depends/patches/qt/mac-qmake.conf ]; then
            mkdir -p depends/patches/qt
            curl --fail -L -o depends/patches/qt/mac-qmake.conf \
              https://raw.githubusercontent.com/bitcoin/bitcoin/v27.0/depends/patches/qt/mac-qmake.conf
          fi
          chmod +x depends/gen_id depends/config.guess depends/config.sub
      - uses: actions/download-artifact@v4
        with:
          name: randomx-linux
          path: /tmp/randomx-linux/
      - name: Install RandomX into depends prefix
        run: |
          mkdir -p depends/x86_64-pc-linux-gnu/lib depends/x86_64-pc-linux-gnu/include
          cp /tmp/randomx-linux/librandomx.a depends/x86_64-pc-linux-gnu/lib/
          curl --fail -L -o /tmp/rx-src.tgz \
            https://github.com/tevador/RandomX/archive/refs/tags/v1.2.1.tar.gz
          tar -xf /tmp/rx-src.tgz -C /tmp
          cp /tmp/RandomX-1.2.1/src/randomx.h depends/x86_64-pc-linux-gnu/include/
      - name: Build depends
        run: make -C depends HOST=x86_64-pc-linux-gnu -j$(nproc)
      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure \
            --prefix="$PWD/depends/x86_64-pc-linux-gnu" \
            --disable-bench --disable-tests \
            --with-gui=qt5
          make -j$(nproc)
          make install
      - name: Package Linux
        run: |
          PREFIX=$PWD/depends/x86_64-pc-linux-gnu
          STAGE=$PWD/rcpu-${GITHUB_REF_NAME}-narnia-core-27.0.0
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$PREFIX/bin/rcpud" "$PREFIX/bin/rcpu-qt" \
                "$PREFIX/bin/rcpu-cli" "$PREFIX/bin/rcpu-tx" \
                "$PREFIX/bin/rcpu-wallet" "$STAGE/" 2>/dev/null || true
          tar -C "$(dirname "$STAGE")" -czf \
            "rcpu-${GITHUB_REF_NAME}-narnia-core-27.0.0-x86_64-linux-gnu.tgz" \
            "$(basename "$STAGE")"
          sha256sum *.tgz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            *.tgz
            SHA256SUMS-linux.txt

  build-windows:
    needs: build-randomx-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev \
            automake pkg-config bsdmainutils python3 cmake curl \
            g++-mingw-w64-x86-64-posix nsis
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Repair depends tree
        run: |
          chmod +x depends/gen_id depends/config.guess depends/config.sub 2>/dev/null || true
          if [ ! -x depends/gen_id ]; then
            echo "ERROR: depends/gen_id is not executable"
            ls -la depends/gen_id || true
            exit 1
          fi
          if [ ! -f depends/config.guess ]; then
            curl --fail -L -o depends/config.guess \
              https://raw.githubusercontent.com/bitcoin/bitcoin/v27.0/depends/config.guess
          fi
          if [ ! -f depends/config.sub ]; then
            curl --fail -L -o depends/config.sub \
              https://raw.githubusercontent.com/bitcoin/bitcoin/v27.0/depends/config.sub
          fi
          if [ ! -f depends/patches/qt/mac-qmake.conf ]; then
            mkdir -p depends/patches/qt
            curl --fail -L -o depends/patches/qt/mac-qmake.conf \
              https://raw.githubusercontent.com/bitcoin/bitcoin/v27.0/depends/patches/qt/mac-qmake.conf
          fi
          chmod +x depends/gen_id depends/config.guess depends/config.sub
      - uses: actions/download-artifact@v4
        with:
          name: randomx-windows
          path: /tmp/randomx-windows/
      - name: Install RandomX into depends prefix
        run: |
          mkdir -p depends/x86_64-w64-mingw32/lib depends/x86_64-w64-mingw32/include
          cp /tmp/randomx-windows/librandomx.a depends/x86_64-w64-mingw32/lib/
          curl --fail -L -o /tmp/rx-src.tgz \
            https://github.com/tevador/RandomX/archive/refs/tags/v1.2.1.tar.gz
          tar -xf /tmp/rx-src.tgz -C /tmp
          cp /tmp/RandomX-1.2.1/src/randomx.h depends/x86_64-w64-mingw32/include/
      - name: Build depends
        run: make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)
      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure \
            --prefix="$PWD/depends/x86_64-w64-mingw32" \
            --disable-bench --disable-tests \
            --with-gui=qt5
          make -j$(nproc)
          make deploy
      - name: Package Windows
        run: |
          EXE=$(ls -1t *win64-setup.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "ERROR: No setup.exe found"
            ls -la *.exe 2>/dev/null || true
            exit 1
          fi
          zip "${EXE%.exe}.zip" "$EXE"
          sha256sum "$EXE" "${EXE%.exe}.zip" > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            *win64-setup.exe
            *win64-setup.zip
            SHA256SUMS-windows.txt

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: linux/
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: windows/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/*
            windows/*
