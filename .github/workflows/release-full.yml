name: Release Full (Linux + Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: the build jobs only read the repository. The `release` job
# below re-grants contents:write, because publishing the release is the only
# step that needs it.
permissions:
  contents: read

jobs:
  # A bare `v*` tag is not enough to identify a node release: the miner line
  # also uses v tags (v1.0.x). Building installers and a 700 MB AppImage for a
  # miner tag wastes CI time and publishes the wrong artifacts. Gate every
  # build on a real node release tag.
  tag-guard:
    name: Verify node release tag
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          event="${GITHUB_EVENT_NAME}"
          # Node releases: v<major>.<minor>.<build> with minor >= 1 (1.1.x, 1.2.x, 1.3.x, 1.4.x).
          # Miner releases: 1.0.x, tagged `miner-v<version>`.
          if [ "$event" = "workflow_dispatch" ]; then
            ok=true
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ ! "$tag" =~ ^v1\.0\. ]]; then
            ok=true
          else
            ok=false
            echo "::notice::'$tag' is not a node release tag (expected vX.Y.Z with minor >= 1); skipping node builds. Miner releases use miner-v*."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Verify signed release tag
        if: github.event_name == 'push' && steps.check.outputs.ok == 'true'
        shell: bash
        run: |
          # M-9: a tag push alone is not authorization. Require an annotated,
          # valid signature from the RCPU release key before any build starts.
          gpg --batch --import "${GITHUB_WORKSPACE}/RCPU-DEV-GPG-KEY.asc"
          # actions/checkout can leave only the commit ref for a tag event;
          # fetch the annotated tag object itself before verification.
          git fetch --tags --force origin
          if ! git verify-tag --raw "${GITHUB_REF_NAME}" > /tmp/tagverify.txt 2>&1; then
            cat /tmp/tagverify.txt
            exit 1
          fi
          cat /tmp/tagverify.txt
          grep -F "VALIDSIG 934D5BC95DD4B3ACFEF521B9547633501FE4B8EE" /tmp/tagverify.txt
  build-randomx-linux:
    needs: tag-guard
    if: needs.tag-guard.outputs.ok == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download, patch, and build RandomX (Linux)
        run: |
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors -L -o /tmp/randomx-src.tar.gz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          patch -p1 < "${GITHUB_WORKSPACE}/depends/patches/randomx/custom_configuration.patch"
          grep 'RANDOMX_ARGON_SALT' src/configuration.h
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
      - name: Upload RandomX Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: randomx-linux
          path: /tmp/RandomX-1.2.1/build/librandomx.a
          retention-days: 1

  build-randomx-windows:
    needs: tag-guard
    if: needs.tag-guard.outputs.ok == 'true'
    # Native Windows build via MSYS2/MinGW-w64.
    # Rationale: cross-compiling RandomX on ubuntu-22.04 with
    # g++-mingw-w64 (gcc 12) produced a library whose PoW hash differs from
    # chain consensus (wallets stuck at heights 2000/4000, "high-hash, proof
    # of work failed"). A MinGW-w64 -native- build (gcc 16, MSYS2) was proven
    # to reproduce the chain hash byte-for-byte (see parity gate below).
    #
    # DO NOT replace this job with a cross-compiled RandomX for Windows: the
    # parity gate and the installer must consume the SAME native .a built here.
    # The Windows GUI/daemon are cross-compiled from Ubuntu (build-windows),
    # but the RandomX library they link MUST come from this job's artifact.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup MSYS2 / MinGW-w64 native toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            curl
            patch
      - name: Download, patch, and build RandomX (Windows native MinGW-w64)
        shell: msys2 {0}
        run: |
          WS="${GITHUB_WORKSPACE//\\//}"
          set -euo pipefail
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors -L -o /tmp/randomx-src.tar.gz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          patch -p1 < "$WS/depends/patches/randomx/custom_configuration.patch"
          grep 'RANDOMX_ARGON_SALT' src/configuration.h
          mkdir build-win && cd build-win
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -G "MinGW Makefiles"
          mingw32-make -j$(nproc)
          test -f librandomx.a
      - name: Parity gate - native RandomX must reproduce chain hash (A2000 + A4000)
        # Regression gate: the library just built must compute the exact
        # RandomX hash of blocks A2000 and A4000 that chain nodes accept.
        # If this fails, the Windows PoW behaviour has drifted and the
        # release must be blocked.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE//\\//}"
          g++ -std=c++17 -O2 -I/tmp/RandomX-1.2.1/src -o /tmp/parity.exe \
            "$WS/contrib/devtools/rx_parity_gate.cpp" \
            /tmp/RandomX-1.2.1/build-win/librandomx.a
          /tmp/parity.exe || { echo "PARITY GATE FAILED"; exit 1; }
          mkdir -p ws && cp /tmp/RandomX-1.2.1/build-win/librandomx.a ws/
      - name: Upload RandomX Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: randomx-windows
          path: ws/librandomx.a
          retention-days: 1

  build-linux:
    needs: [tag-guard, build-randomx-linux]
    if: needs.tag-guard.outputs.ok == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev \
            automake pkg-config bsdmainutils python3 cmake curl
      - name: Verify depends tree
        run: |
          sed -i 's/\r$//' depends/gen_id 2>/dev/null || true
          chmod +x depends/gen_id depends/config.guess depends/config.sub 2>/dev/null || true
          if [ ! -x depends/gen_id ]; then
            echo "ERROR: depends/gen_id is not executable"
            ls -la depends/gen_id || true
            exit 1
          fi
          # These files are vendored in depends/. Fetching them at build time
          # from raw.githubusercontent.com would be an unverified download in
          # the release pipeline, so fail closed if one is missing instead.
          for f in depends/config.guess depends/config.sub \
                   depends/patches/qt/mac-qmake.conf; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing; depends/ is vendored, do not fetch it at build time"
              exit 1
            fi
          done
          chmod +x depends/gen_id depends/config.guess depends/config.sub
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: randomx-linux
          path: /tmp/randomx-linux/
      - name: Build depends
        run: make -C depends HOST=x86_64-pc-linux-gnu -j$(nproc)
      - name: Install RandomX into depends prefix
        run: |
          PREFIX="$PWD/depends/x86_64-pc-linux-gnu"
          mkdir -p "$PREFIX/lib" "$PREFIX/include"
          cp /tmp/randomx-linux/librandomx.a "$PREFIX/lib/"
          curl --fail -L -o /tmp/rx-src.tgz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/rx-src.tgz" | sha256sum -c -
          tar -xf /tmp/rx-src.tgz -C /tmp
          cp /tmp/RandomX-1.2.1/src/randomx.h "$PREFIX/include/"
          test -f "$PREFIX/include/randomx.h"
          test -f "$PREFIX/lib/librandomx.a"
      - name: Configure and build
        run: |
          PREFIX="$PWD/depends/x86_64-pc-linux-gnu"
          ./autogen.sh
          CONFIG_SITE="$PREFIX/share/config.site" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-L$PREFIX/lib" \
          ./configure --prefix="$PREFIX" \
            --disable-bench \
            --with-gui=qt5
          make -j$(nproc)
          make install
      - name: Consensus gate - unit suites (Linux)
        run: |
          # Replaces a `strings | grep` check: a symbol being present in the
          # binary does not prove the rule runs on every code path. Build with
          # tests enabled and execute the CT consensus suites for real.
          test -x src/test/test_bitcoin || {
            echo "ERROR: src/test/test_bitcoin missing (was the build configured with --disable-tests?)"
            exit 1
          }
          set -o pipefail
          ./src/test/test_bitcoin --log_level=test_suite \
            --run_test=coinbase_confidential_tests,confidential_validation_tests,tx_verify_tests \
            2>&1 | tee /tmp/rcpu-consensus.log
          # Fail closed if a suite name is typo'd or silently skipped.
          for suite in coinbase_confidential_tests confidential_validation_tests tx_verify_tests; do
            grep -q "$suite" /tmp/rcpu-consensus.log || {
              echo "suite not executed: $suite"
              exit 1
            }
          done
          echo "OK: CT consensus suites passed on the release build"
      - name: Package Linux
        run: |
          PREFIX=$PWD/depends/x86_64-pc-linux-gnu
          PKGVER=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile | head -1)
          echo "PACKAGE_VERSION=$PKGVER"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGVER="${GITHUB_REF_NAME#v}"
            if [ "$PKGVER" != "$TAGVER" ]; then
              echo "ERROR: PACKAGE_VERSION=$PKGVER does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          STAGE=$PWD/rcpu-${PKGVER}
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$PREFIX/bin/rcpud" "$PREFIX/bin/rcpu-qt" \
                "$PREFIX/bin/rcpu-cli" "$PREFIX/bin/rcpu-tx" \
                "$PREFIX/bin/rcpu-wallet" "$STAGE/"
          # Never sign/package a partial or empty tarball: fail if any required
          # binary is missing or zero-length.
          for f in rcpud rcpu-qt rcpu-cli rcpu-tx rcpu-wallet; do
            test -s "$STAGE/$f" || { echo "ERROR: missing or empty $STAGE/$f"; exit 1; }
          done
          tar -C "$(dirname "$STAGE")" -czf \
            "rcpu-${PKGVER}-x86_64-linux-gnu.tgz" \
            "$(basename "$STAGE")"
          # Explicit filename: a bare *.tgz glob would also pick up any stray
          # archive left in the workspace and sign it into the checksum file.
          sha256sum "rcpu-${PKGVER}-x86_64-linux-gnu.tgz" > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-package
          path: |
            *.tgz
            SHA256SUMS-linux.txt

  build-windows:
    needs: [tag-guard, build-randomx-windows]
    if: needs.tag-guard.outputs.ok == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev \
            automake pkg-config bsdmainutils python3 cmake curl \
            g++-mingw-w64-x86-64-posix nsis zip osslsigncode
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Verify depends tree
        run: |
          sed -i 's/\r$//' depends/gen_id 2>/dev/null || true
          chmod +x depends/gen_id depends/config.guess depends/config.sub 2>/dev/null || true
          if [ ! -x depends/gen_id ]; then
            echo "ERROR: depends/gen_id is not executable"
            ls -la depends/gen_id || true
            exit 1
          fi
          # These files are vendored in depends/. Fetching them at build time
          # from raw.githubusercontent.com would be an unverified download in
          # the release pipeline, so fail closed if one is missing instead.
          for f in depends/config.guess depends/config.sub \
                   depends/patches/qt/mac-qmake.conf; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing; depends/ is vendored, do not fetch it at build time"
              exit 1
            fi
          done
          chmod +x depends/gen_id depends/config.guess depends/config.sub
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: randomx-windows
          path: /tmp/randomx-windows/
      - name: Build depends
        run: make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)
      - name: Install RandomX into depends prefix
        # The .a below is the MSYS2/MINGW64 -native- build produced by
        # build-randomx-windows (the same artifact that passed the parity
        # gate). It is the ONLY RandomX library allowed to be linked into the
        # Windows installer; never rebuild RandomX in this Ubuntu cross
        # environment, or the 2000/4000-height high-hash bug returns.
        run: |
          PREFIX="$PWD/depends/x86_64-w64-mingw32"
          mkdir -p "$PREFIX/lib" "$PREFIX/include"
          cp /tmp/randomx-windows/librandomx.a "$PREFIX/lib/"
          curl --fail -L -o /tmp/rx-src.tgz \
            https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/rx-src.tgz" | sha256sum -c -
          tar -xf /tmp/rx-src.tgz -C /tmp
          cp /tmp/RandomX-1.2.1/src/randomx.h "$PREFIX/include/"
          test -f "$PREFIX/include/randomx.h"
          test -f "$PREFIX/lib/librandomx.a"
      - name: Configure and build
        run: |
          PREFIX="$PWD/depends/x86_64-w64-mingw32"
          ./autogen.sh
          CONFIG_SITE="$PREFIX/share/config.site" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-L$PREFIX/lib" \
          ./configure --prefix="$PREFIX" \
            --disable-bench --disable-tests \
            --with-gui=qt5
          make -j$(nproc)
          make deploy
      - name: Verify Windows binary was produced
        run: |
          # The consensus behaviour of this build is gated by the Linux job's
          # unit suites for the same commit above, and by ci.yml on the same
          # commit. `strings | grep` only proved a symbol was linked in, not
          # that the rule executed, so it is not repeated here.
          BIN=$(ls -1t src/rcpud.exe 2>/dev/null | head -1)
          test -n "$BIN" && test -x "$BIN" || { echo "ERROR: src/rcpud.exe missing"; exit 1; }
          ls -l "$BIN"
          echo "OK: Windows rcpud.exe produced"
      - name: Package Windows
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          PKGVER=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile | head -1)
          echo "PACKAGE_VERSION=$PKGVER"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGVER="${GITHUB_REF_NAME#v}"
            if [ "$PKGVER" != "$TAGVER" ]; then
              echo "ERROR: PACKAGE_VERSION=$PKGVER does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          test -n "$PKGVER" || { echo "ERROR: PKGVER empty"; exit 1; }
          echo "=== looking for installer / exe ==="
          find . -maxdepth 3 \( -iname '*win64-setup.exe' -o -iname 'rcpu-qt.exe' -o -iname 'rcpud.exe' \) | head -50
          ls -la . src src/qt 2>/dev/null | head -80

          EXPECTED="rcpu-${PKGVER}-win64-setup.exe"
          EXE=""
          if [ -f "$EXPECTED" ]; then
            EXE="$EXPECTED"
          else
            # only the canonical rcpu-*-win64-setup.exe pattern; never bitcoin--*
            EXE=$(ls -1t rcpu-*-win64-setup.exe 2>/dev/null | head -1 || true)
          fi

          if [ -n "$EXE" ]; then
            test -s "$EXE" || { echo "ERROR: $EXE is empty"; exit 1; }
            # NSIS installer should be multiple MB, not a stub
            SIZE=$(stat -c%s "$EXE")
            test "$SIZE" -ge 1000000 || { echo "ERROR: $EXE too small ($SIZE bytes)"; exit 1; }
            file "$EXE" || true
            # Authenticode signing: enabled when the PFX (base64) and password
            # secrets are configured. Unsigned releases still work but trigger
            # SmartScreen; release managers should set the secrets.
            if [ -n "${WINDOWS_SIGNING_CERT:-}" ]; then
              echo "Signing $EXE with Authenticode"
              printf '%s' "$WINDOWS_SIGNING_CERT" | base64 -d > /tmp/rcpu-sign.pfx
              osslsigncode sign -pkcs12 /tmp/rcpu-sign.pfx \
                -pass "${WINDOWS_SIGNING_PASSWORD}" \
                -n "RCPU Core" -i "https://rcpu.top" \
                -t "https://timestamp.digicert.com" \
                -in "$EXE" -out "${EXE}.signed"
              mv "${EXE}.signed" "$EXE"
              osslsigncode verify -in "$EXE"
              rm -f /tmp/rcpu-sign.pfx
            else
              echo "WARNING: WINDOWS_SIGNING_CERT not configured; installer will be unsigned"
            fi
            zip "rcpu-${PKGVER}-win64-setup.zip" "$EXE"
            sha256sum "$EXE" "rcpu-${PKGVER}-win64-setup.zip" > SHA256SUMS-windows.txt
            cat SHA256SUMS-windows.txt
            exit 0
          fi

          echo "No NSIS installer; packing portable zip"
          mkdir -p dist
          cp -v src/qt/rcpu-qt.exe dist/ 2>/dev/null || cp -v src/rcpu-qt.exe dist/
          cp -v src/rcpud.exe src/rcpu-cli.exe src/rcpu-tx.exe src/rcpu-wallet.exe dist/ 2>/dev/null || true
          test -f dist/rcpu-qt.exe
          test -s dist/rcpu-qt.exe
          zip -j "rcpu-${PKGVER}-win64-portable.zip" dist/*
          sha256sum "rcpu-${PKGVER}-win64-portable.zip" > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-package
          path: |
            *setup.exe
            *setup.zip
            *portable.zip
            SHA256SUMS-windows.txt

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    # The only job that needs to publish; everything else stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-package
          path: linux/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-package
          path: windows/
      - name: Merge checksums
        run: |
          cat linux/SHA256SUMS-linux.txt windows/SHA256SUMS-windows.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign and verify with the RCPU release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # M-9: a release must be signed by the documented RCPU key. Do not
          # publish an unsigned or differently-keyed artifact on a tag build.
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "ERROR: GPG_PRIVATE_KEY is not configured; refusing to publish an unsigned release"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          FPR="934D5BC95DD4B3ACFEF521B9547633501FE4B8EE"
          gpg --batch --list-secret-keys "$FPR" >/dev/null
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --pinentry-mode loopback \
            --local-user "$FPR!" \
            --output SHA256SUMS.txt.asc \
            --detach-sig SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          {
            echo "RELEASE_FILES<<EOF"
            echo "linux/*"
            echo "windows/*"
            echo "SHA256SUMS.txt"
            echo "SHA256SUMS.txt.asc"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ env.RELEASE_FILES }}
