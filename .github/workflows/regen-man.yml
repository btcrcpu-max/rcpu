name: Regenerate man pages

on:
  workflow_dispatch:

jobs:
  regen-man:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update -qq
          sudo apt-get install -y help2man build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 cmake curl ca-certificates patch \
            libevent-dev libboost-dev libsqlite3-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            libqrencode-dev libminiupnpc-dev libprotobuf-dev protobuf-compiler

      - name: Build RandomX
        run: sudo bash scripts/build-randomx.sh

      - name: Configure and build GUI
        run: |
          ./autogen.sh
          CPPFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib" \
            ./configure --with-gui=qt5 --disable-bench
          make -j$(nproc)

      - name: Check binaries and version
        run: |
          ./src/rcpud --version
          ./src/rcpud --version | grep -q '1.1.6'
          for b in src/rcpud src/rcpu-cli src/rcpu-tx src/rcpu-wallet src/rcpu-util src/qt/rcpu-qt; do
            test -x "$b" || { echo "missing $b"; exit 1; }
          done
          QT_QPA_PLATFORM=offscreen ./src/qt/rcpu-qt --version | grep -q '1.1.6'

      - name: Regenerate man pages
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":0"
        run: |
          python3 contrib/devtools/gen-manpages.py
          git diff --stat doc/man/
          mkdir -p man-out
          cp doc/man/rcpud.1 doc/man/rcpu-cli.1 doc/man/rcpu-tx.1 \
             doc/man/rcpu-wallet.1 doc/man/rcpu-util.1 doc/man/rcpu-qt.1 man-out/
          git diff doc/man/ > man-out/man.patch

      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-man-v1.1.6
          path: man-out/
