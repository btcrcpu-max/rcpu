name: Release GUI (AppImage)

# Trigger on any tag starting with v (e.g. v1.0.0, v1.0.1, etc.)
on:
  push:
    tags:
      - "v*"

# Least privilege: only the `release` job needs to publish.
permissions:
  contents: read

jobs:
  # A bare `v*` tag is not enough to identify a node release: the miner line
  # also uses v tags (v1.0.x). Building installers and a 700 MB AppImage for a
  # miner tag wastes CI time and publishes the wrong artifacts. Gate every
  # build on a real node release tag.
  tag-guard:
    name: Verify node release tag
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify signed release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          # M-9: a tag push alone is not authorization. Require an annotated,
          # valid signature from the RCPU release key before any build starts.
          gpg --batch --import "${GITHUB_WORKSPACE}/RCPU-DEV-GPG-KEY.asc"
          if ! git verify-tag --raw "${GITHUB_REF_NAME}" > /tmp/tagverify.txt 2>&1; then
            cat /tmp/tagverify.txt
            exit 1
          fi
          cat /tmp/tagverify.txt
          grep -F "VALIDSIG 934D5BC95DD4B3ACFEF521B9547633501FE4B8EE" /tmp/tagverify.txt
      - id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          event="${GITHUB_EVENT_NAME}"
          # Node releases: v<major>.<minor>.<build> with minor >= 1 (1.1.x, 1.2.x, 1.3.x, 1.4.x).
          # Miner releases: 1.0.x, tagged `miner-v<version>`.
          if [ "$event" = "workflow_dispatch" ]; then
            ok=true
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ ! "$tag" =~ ^v1\.0\. ]]; then
            ok=true
          else
            ok=false
            echo "::notice::'$tag' is not a node release tag (expected vX.Y.Z with minor >= 1); skipping node builds. Miner releases use miner-v*."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
  build-appimage:
    needs: tag-guard
    if: needs.tag-guard.outputs.ok == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 autoconf-archive cmake \
            libssl-dev libevent-dev libboost-all-dev \
            libsqlite3-dev libdb-dev libdb++-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            libqrencode-dev libprotobuf-dev protobuf-compiler \
            libminiupnpc-dev libfuse2 wget

      - name: Build RandomX dependency
        run: |
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors -L -o /tmp/randomx-src.tar.gz https://codeload.github.com/tevador/RandomX/tar.gz/refs/tags/v1.2.1
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          patch -p1 < ${{ github.workspace }}/depends/patches/randomx/custom_configuration.patch
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build rcpu-qt (with GUI)
        run: |
          ./autogen.sh
          CPPFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib" \
            ./configure --with-gui=qt5 --prefix=/usr
          make -j$(nproc)

      - name: Install to AppDir
        run: |
          make install DESTDIR=$PWD/AppDir

      - name: Download linuxdeploy & appimagetool
        run: |
          # S-05: pinned releases + SHA256 instead of the 'continuous' tags.
          # 'continuous' is a moving target that can be silently replaced; we
          # verify the exact payload we are about to execute.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          wget -q https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage -O appimagetool
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy" | sha256sum -c -
          echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt" | sha256sum -c -
          echo "d918b4df547b388ef253f3c9e7f6529ca81a885395c31f619d9aaf7030499a13  appimagetool" | sha256sum -c -
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool

      - name: Create desktop entry
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/rcpu-qt.desktop << DESKTOP_EOF
          [Desktop Entry]
          Name=RCPU Qt Wallet
          Exec=rcpu-qt
          Type=Application
          Icon=rcpu-qt
          Categories=Office;Finance;
          DESKTOP_EOF
          # Also copy to AppDir root for linuxdeploy to find it
          cp AppDir/usr/share/applications/rcpu-qt.desktop AppDir/rcpu-qt.desktop
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp contrib/appimage/rcpu-qt.svg AppDir/usr/share/icons/hicolor/scalable/apps/rcpu-qt.svg

      - name: Create AppImage
        run: |
          export QT_SELECT=qt5
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          ./linuxdeploy --appdir AppDir \
            --plugin qt \
            --output appimage
          ls -la *.AppImage

      - name: Rename AppImage
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          VER="${VER#v}"
          # The tag name becomes a filename and is later written into
          # $GITHUB_ENV and a shell heredoc. Restrict it to characters that are
          # inert in both, so a tag can never inject shell metacharacters.
          if ! printf '%s' "$VER" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "ERROR: unsafe tag name '${GITHUB_REF_NAME}'"
            exit 1
          fi
          ASSET="rcpu-qt-${VER}-x86_64.AppImage"
          mv *.AppImage "$ASSET"
          echo "APPIMAGE_ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Generate SHA256 checksum
        run: |
          sha256sum "$APPIMAGE_ASSET" > "$APPIMAGE_ASSET.sha256"

      - name: Sign and verify with the RCPU release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # M-9: refuse to publish an unsigned or differently-keyed AppImage.
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "ERROR: GPG_PRIVATE_KEY is not configured; refusing to publish an unsigned release"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          FPR="934D5BC95DD4B3ACFEF521B9547633501FE4B8EE"
          gpg --batch --list-secret-keys "$FPR" >/dev/null
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --pinentry-mode loopback \
            --local-user "$FPR!" \
            --output "$APPIMAGE_ASSET.asc" \
            --detach-sig "$APPIMAGE_ASSET"
          gpg --batch --verify "$APPIMAGE_ASSET.asc" "$APPIMAGE_ASSET"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appimage
          path: |
            *.AppImage
            *.AppImage.sha256
            *.AppImage.asc
          if-no-files-found: error
          retention-days: 1

  # Publishing is isolated in its own job so the build job (which downloads and
  # runs third-party AppImage tooling) never holds a write token.
  release:
    needs: [tag-guard, build-appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: appimage
          path: dist/

      - name: Collect release files
        run: |
          cd dist
          ls -la
          # The release action runs from the workspace root, so keep the dist/
          # prefix on every path.
          {
            echo "RELEASE_FILES<<EOF"
            for f in *.AppImage *.AppImage.sha256; do printf 'dist/%s\n' "$f"; done
            # Only include the signature when one was actually produced.
            for f in *.AppImage.asc; do [ -e "$f" ] && printf 'dist/%s\n' "$f"; done
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: ${{ env.RELEASE_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
