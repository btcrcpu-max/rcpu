name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qrencode
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-db
            mingw-w64-x86_64-cmake
            git
            make
            patch
            zip

      - name: Build RandomX dependency
        run: |
          curl --fail -L -o /tmp/randomx-src.tar.gz https://github.com/tevador/RandomX/archive/refs/tags/v1.2.1.tar.gz
          # Pin the exact tarball to make historical CI builds reproducible and
          # detect silent supply-chain modification before it is compiled.
          echo "2e6dd3bed96479332c4c8e4cab2505699ade418a07797f64ee0d4fa394555032  /tmp/randomx-src.tar.gz" | sha256sum -c -
          tar -xf /tmp/randomx-src.tar.gz -C /tmp
          cd /tmp/RandomX-1.2.1
          # GITHUB_WORKSPACE is a Windows path on this runner; convert for MSYS2.
          patch -p1 < "$(cygpath -u "$GITHUB_WORKSPACE")/depends/patches/randomx/custom_configuration.patch"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/mingw64 -DARCH=native
          cmake --build . -j$(nproc)
          cmake --install .
        working-directory: ${{ github.workspace }}

      - name: Build Windows GUI
        run: |
          ./autogen.sh
          ./configure --with-gui=qt5 --prefix=/opt/rcpu \
            --with-boost=/mingw64 \
            --with-boost-libdir=/mingw64/lib
          make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rcpu-windows
          path: |
            src/qt/rcpu-qt.exe
            src/rcpud.exe
            src/rcpu-cli.exe
            src/rcpu-tx.exe

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ../rcpu-${{ github.ref_name }}-win64
          cp src/qt/rcpu-qt.exe src/rcpud.exe src/rcpu-cli.exe src/rcpu-tx.exe ../rcpu-${{ github.ref_name }}-win64/
          cd ..
          zip -r rcpu-${{ github.ref_name }}-win64.zip rcpu-${{ github.ref_name }}-win64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ../rcpu-${{ github.ref_name }}-win64.zip
          token: ${{ secrets.GITHUB_TOKEN }}