server=1
listen=1
port=7227
rpcport=7337
txindex=0

# SECURITY: the RPC server is authenticated with a per-run cookie and must
# stay local. Do not change the bind/allow lines to 0.0.0.0 and do not add
# remote -rpcallowip entries; use an SSH tunnel or WireGuard instead.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# RPC auth: with server=1 the node creates a random auth cookie at
# ~/.rcpu/rcpu/.cookie; rcpu-cli reads it automatically. A static
# rpcuser/rpcpassword is optional — never expose the RPC port publicly.

# Seeds mirror the compiled list in src/chainparamsseeds.h
# (3 DNS + 3 IPs; keep in sync with docs/nodes/README.md).
addnode=seed1.rcpu.top:7227
addnode=seed2.rcpu.top:7227
addnode=seed3.rcpu.top:7227
addnode=207.57.129.188:7227
addnode=38.147.171.29:7227
addnode=38.55.199.177:7227
